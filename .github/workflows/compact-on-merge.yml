name: Compact Trajectories on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  compact:
    # Only run when PR is actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for trajectory lookup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compact trajectories for this PR
        id: compact
        run: |
          # Run compact command for this PR
          npx trail compact --pr ${{ github.event.pull_request.number }} --output .trajectories/compacted/pr-${{ github.event.pull_request.number }}.json

          # Check if any compaction was done
          if [ -f ".trajectories/compacted/pr-${{ github.event.pull_request.number }}.json" ]; then
            echo "compacted=true" >> $GITHUB_OUTPUT
          else
            echo "compacted=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit compacted trajectories
        if: steps.compact.outputs.compacted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .trajectories/compacted/
          git commit -m "chore: compact trajectories for PR #${{ github.event.pull_request.number }}

          Automatically generated trajectory compaction.

          Source PR: #${{ github.event.pull_request.number }}
          PR Title: ${{ github.event.pull_request.title }}" || echo "No changes to commit"
          git push
